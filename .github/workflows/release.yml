name: Release Horizon Native Mod

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run unit tests
        run: cargo test --verbose

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package .hnmod bundle
        run: python package.py --out dist

      - name: Calculate SHA-256
        id: hash
        run: |
          sha=$(sha256sum dist/*.hnmod | awk '{print $1}')
          echo "SHA256: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Install Horizon build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Verify full native mod against Horizon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://github.com/horizon-rust/horizon-mods.git "$RUNNER_TEMP/horizon-mods"
          mod="$RUNNER_TEMP/horizon-mods/native/durability-tooltip"
          mkdir -p "$mod"
          cp -r compatibility.json mixins LICENSE "$mod/"
          python3 "$RUNNER_TEMP/horizon-mods/native/tools/native.py" check durability-tooltip --horizon latest

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.hnmod
          generate_release_notes: true
          draft: false
          prerelease: false
